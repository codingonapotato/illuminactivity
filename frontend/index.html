<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self; connect-src 'self' http://127.0.0.1:8080 http://localhost:8080;'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self; connect-src 'self' http://127.0.0.1:8080 http://localhost:8080;'"
    />
    <title>Hello from Electron renderer!</title>
  </head>
  <body>
    <h1>Hello from Electron renderer!</h1>
    <p>👋</p>
    <button onclick="greetings"> Click Me! </button>
  </body>
  <script>
    const greetings = async () => {
      const res = await fetch("http://localhost:8080/greeting?name=electronJS")
      const resJson = await res.json()
      alert(resJson.content);
    }
  </script>
</html>
